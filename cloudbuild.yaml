options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg=VITE_SHOPIFY_DOMAIN=jeremykittel.myshopify.com'
      - '--build-arg=VITE_SHOPIFY_STOREFRONT_TOKEN=4cf98fc7be521e5c50ed2bc7f22f2719'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stones-river-album'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/stones-river-album']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'stones-river-album'
      - '--image=gcr.io/$PROJECT_ID/stones-river-album'
      - '--region=us-east1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
